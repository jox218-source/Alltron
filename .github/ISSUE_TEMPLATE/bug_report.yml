name: Bug report
description: Report a reproducible problem (please remove secrets and household details).
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Alltron is pre-alpha. Never include passwords, tokens, real hostnames or IPs, entity names, household details, or recordings. Redact logs before posting. For vulnerabilities, follow SECURITY.md instead.
  - type: input
    id: revision
    attributes:
      label: Alltron revision
      description: Release tag or short commit hash.
      placeholder: "v0.0.0 or abc1234"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS/version, hardware model, and relevant component versions. Do not include device identifiers or network addresses.
      placeholder: "Raspberry Pi model (if applicable), OS version"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "Use fictional data and a test instance."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove all credentials, addresses, entity names, paths containing your username, and personal data. Write “none” if unavailable.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked this report for credentials, personal data, hostnames, IP addresses, entity names, and recordings.
          required: true
