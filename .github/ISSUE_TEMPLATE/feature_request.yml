name: Feature request
description: Suggest a user-facing improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user need and how to verify the behavior. Do not include private household data, credentials, or real device/network details.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      placeholder: "As an operator, I need…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy, permissions, or safety impact
      description: Does this use audio, transcripts, Home Assistant access, external services, or new stored data?
    validations:
      required: true
