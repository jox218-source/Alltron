name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install -e ".[audit]"
      - name: Audit complete post-root history
        run: python tools/publication_audit.py
      - name: Audit local files including ignored credential paths
        run: python -m tools.credential_audit
      - name: Verify audit regression tests
        run: python -m unittest discover -s tests -p test_publication_audit.py -v

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Preflight
        run: python -m alltron --check
      - name: Build and verify source preview
        run: |
          python tools/build_release.py --output-dir dist
          python tools/build_release.py --verify dist/alltron-*-source.zip
      - name: Rehearse local preview installation
        run: python -m tools.rehearse_preview --archive dist/alltron-*-source.zip
